<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>UBUK.NET — Latif Connect Framework</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100vw;overflow-x:hidden}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background-color:#050c18;background-image:radial-gradient(circle at 50% 50%,rgba(243,212,110,.09) 2px,transparent 3px,transparent 14px,rgba(30,64,175,.18) 15px,transparent 17px,transparent 28px,rgba(212,175,55,.12) 29px,transparent 31px,transparent 42px,rgba(37,99,235,.15) 43px,transparent 45px),repeating-conic-gradient(from 0deg at 50% 50%,rgba(212,175,55,.07) 0deg 15deg,rgba(12,34,68,.22) 15deg 30deg);background-size:96px 96px,96px 96px;color:#f8fafc;min-height:100vh;padding-bottom:28px}
.wrap{width:100%;max-width:760px;margin:0 auto;padding:8px 8px 20px}
.top-head{text-align:center;margin-bottom:9px}
.head-bar{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:5px}
.head-logo{flex-shrink:0}
.top-head h1{color:#f3d46e;font-size:clamp(1.7rem,5vw,2.25rem);letter-spacing:3px;font-weight:900;line-height:1;text-shadow:0 0 20px rgba(243,212,110,.55)}
.top-head .sub{color:#d4af37;font-size:.66rem;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;margin-top:3px}
.manifesto{width:100%;margin:0 auto;background:rgba(5,13,24,.88);border:1px solid rgba(212,175,55,.5);border-radius:10px;padding:7px 9px;font-size:.63rem;line-height:1.38;color:#f3d46e;text-align:justify;text-align-last:center}
.manifesto .mission{display:block;margin-top:3px;color:#fef08a;font-weight:700;font-size:.61rem}
.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px;width:100%}
.kpi-box{background:rgba(5,13,24,.88);border:1px solid rgba(212,175,55,.42);border-radius:10px;padding:6px;min-width:0}
.kpi-head{display:flex;justify-content:space-between;font-size:.54rem;font-weight:800;color:#e2e8f0;margin-bottom:4px;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:2px;gap:2px}
.kpi-head span{color:#10b981;white-space:nowrap}
.bars{display:flex;align-items:flex-end;gap:3px;height:28px;margin-bottom:4px}
.bars i{flex:1;background:linear-gradient(180deg,#f3d46e,#b45309);border-radius:2px 2px 0 0;display:block}
.hbars{display:grid;gap:2px;margin-bottom:4px}
.hbar{display:flex;align-items:center;gap:4px;font-size:.51rem;color:#94a3b8}
.hbar div{flex:1;height:4px;background:#1e293b;border-radius:4px;overflow:hidden}
.hbar span{display:block;height:100%;background:linear-gradient(90deg,#10b981,#f3d46e)}
.kpi-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;text-align:center}
.kpi-nums b{display:block;color:#fff;font-size:.66rem}
.kpi-nums small{color:#94a3b8;font-size:.46rem}
