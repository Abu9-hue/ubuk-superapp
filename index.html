<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>UBUK.NET — Latif Connect Framework</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background-color:#061224;background-image:radial-gradient(circle at 50% 50%,transparent 28px,rgba(212,175,55,.22) 29px,transparent 31px,transparent 56px,rgba(37,99,235,.32) 57px,transparent 60px),repeating-conic-gradient(from 0deg at 50% 45%,rgba(212,175,55,.12) 0deg 15deg,rgba(15,45,82,.28) 15deg 30deg);background-size:140px 140px,100% 100%;color:#f8fafc;min-height:100vh;overflow-x:hidden}
.wrap{max-width:740px;margin:0 auto;padding:8px 8px 18px}
.top-head{text-align:center;margin-bottom:10px}
.head-bar{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:5px}
.head-logo{flex-shrink:0}
.top-head h1{color:#f3d46e;font-size:clamp(1.45rem,4vw,2rem);letter-spacing:3.5px;font-weight:900;line-height:1;text-shadow:0 0 20px rgba(243,212,110,.5)}
.top-head .sub{color:#d4af37;font-size:.58rem;letter-spacing:1.6px;text-transform:uppercase;margin-top:3px}
.manifesto{width:100%;margin:0 auto;background:rgba(5,13,24,.84);border:1px solid rgba(212,175,55,.5);border-radius:11px;padding:7px 10px;font-size:.6rem;line-height:1.4;color:#f3d46e;text-align:justify;text-align-last:center;box-shadow:0 5px 16px rgba(0,0,0,.6)}
.manifesto .mission{display:block;margin-top:3px;color:#fef08a;font-weight:700;font-size:.58rem}
.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.kpi-box{background:rgba(5,13,24,.84);border:1px solid rgba(212,175,55,.42);border-radius:11px;padding:8px}
.kpi-head{display:flex;justify-content:space-between;font-size:.58rem;font-weight:800;color:#e2e8f0;margin-bottom:5px;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:3px;gap:3px}
.kpi-head span{color:#10b981;white-space:nowrap}
.bars{display:flex;align-items:flex-end;gap:3px;height:32px;margin-bottom:5px}
.bars i{flex:1;background:linear-gradient(180deg,#f3d46e,#b45309);border-radius:2px 2px 0 0;display:block}
.hbars{display:grid;gap:3px;margin-bottom:5px}
.hbar{display:flex;align-items:center;gap:4px;font-size:.52rem;color:#94a3b8}
.hbar div{flex:1;height:4px;background:#1e293b;border-radius:4px;overflow:hidden}
.hbar span{display:block;height:100%;background:linear-gradient(90deg,#10b981,#f3d46e)}
.kpi-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;text-align:center}
.kpi-nums b{display:block;color:#fff;font-size:.68rem}
.kpi-nums small{color:#94a3b8;font-size:.48rem}
  .top-cta{display:flex;justify-content:center;margin-bottom:20px}
.btn-app-gold{background:linear-gradient(135deg,#fef08a 0%,#d4af37 50%,#b45309 100%);color:#050b12;text-decoration:none;font-weight:900;font-size:.72rem;padding:9px 18px;border-radius:999px;border:1px solid #fef08a;box-shadow:0 0 22px rgba(212,175,55,.55);display:inline-flex;align-items:center;justify-content:center;gap:6px;letter-spacing:.4px}
.arena{position:relative;width:100%;margin:0 auto 12px;display:grid;grid-template-columns:minmax(88px,104px) 1fr minmax(88px,104px);grid-template-rows:auto auto;gap:24px 4px;align-items:center;justify-items:center}
@media(min-width:640px){.arena{grid-template-columns:132px 1fr 132px;gap:28px 14px}}
.benef-slot{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:100%}
.pill-top{position:absolute;top:-18px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.12);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.28);color:#f8fafc;font-size:.5rem;font-weight:800;letter-spacing:.8px;padding:1px 8px;border-radius:999px;white-space:nowrap}
.card-p{width:100%;min-height:118px;background:rgba(8,16,28,.9);border:1.5px solid #d4af37;border-radius:10px;overflow:hidden;position:relative;box-shadow:0 6px 16px rgba(0,0,0,.6)}
.num-badge{position:absolute;top:4px;right:4px;background:rgba(5,11,18,.9);color:#f3d46e;font-weight:900;font-size:.55rem;padding:1px 4px;border-radius:4px;border:1px solid #d4af37;z-index:3}
.num-wm{position:absolute;top:12px;left:5px;font-size:1.3rem;font-weight:900;color:rgba(243,212,110,.16);pointer-events:none;z-index:1}
.avatar-box{height:60px;background:radial-gradient(circle at 50% 40%,#1e3a5f,#071019);display:flex;align-items:center;justify-content:center;font-size:1.75rem;position:relative;z-index:2}
@media(min-width:640px){.avatar-box{height:94px;font-size:2.4rem}}
.p-info{padding:4px 5px;background:#060e17;border-top:1px solid rgba(212,175,55,.3);text-align:left}
.p-info strong{display:block;color:#fff;font-size:.59rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-info span{color:#cbd5e1;font-size:.51rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.globe-wrap{grid-column:2;grid-row:1/3;position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}
#globeCanvas{width:142px;height:142px;border-radius:50%;border:2px solid var(--glow,#ef4444);box-shadow:0 0 38px var(--glow,#ef4444);transition:box-shadow .6s ease,border-color .6s ease}
@media(min-width:640px){#globeCanvas{width:224px;height:224px}}
.orbit-news{margin-top:-13px;background:rgba(5,11,18,.94);border:1.5px solid var(--glow,#ef4444);color:#fff;padding:4px 8px;border-radius:999px;font-size:.52rem;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.7);text-align:center;max-width:160px;transition:border-color .6s ease}
@media(min-width:640px){.orbit-news{font-size:.72rem;max-width:320px;padding:5px 14px}}
.rainbow-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;width:100%;max-width:310px;margin:8px auto 0}
.r-btn{background:rgba(5,13,24,.9);border:1px solid var(--bc,#d4af37);border-radius:8px;padding:6px 6px;font-size:.53rem;font-weight:800;color:#f8fafc;cursor:pointer;text-transform:uppercase;letter-spacing:.2px;box-shadow:0 3px 10px rgba(0,0,0,.5);display:flex;align-items:center;gap:5px;text-align:left;line-height:1.15}
.r-btn i{width:8px;height:8px;border-radius:50%;background:var(--bc);box-shadow:0 0 8px var(--bc);flex-shrink:0}
footer{width:100%;max-width:340px;margin:8px auto 0;padding:3px 2px;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;text-align:justify;text-align-last:center;font-size:.40rem;color:rgba(243,212,110,.26);letter-spacing:.12px;line-height:1.5;pointer-events:none;user-select:none}
.page-modal{display:none;position:fixed;inset:0;background:#050b12;z-index:999;overflow-y:auto;padding:18px}
.page-modal.open{display:block}
.modal-inner{max-width:960px;margin:0 auto;background:#0b1726;border:1px solid #d4af37;border-radius:16px;padding:20px}
.modal-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(212,175,55,.3);padding-bottom:12px;margin-bottom:16px}
.btn-retour{background:#10b981;color:#fff;border:none;padding:9px 16px;border-radius:10px;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="top-head">
    <div class="head-bar">
      <div class="head-logo">
        <svg width="46" height="46" viewBox="0 0 120 120" style="filter:drop-shadow(0 0 10px rgba(243,212,110,.6))">
          <defs>
            <radialGradient id="gSph" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#10b981" stop-opacity=".45"/><stop offset="55%" stop-color="#1e3a8a" stop-opacity=".6"/><stop offset="100%" stop-color="#7e22ce" stop-opacity=".85"/></radialGradient>
            <linearGradient id="gInf" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ef4444"/><stop offset="25%" stop-color="#f97316"/><stop offset="50%" stop-color="#fef08a"/><stop offset="75%" stop-color="#10b981"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
          </defs>
          <circle cx="60" cy="60" r="46" fill="url(#gSph)" stroke="#f3d46e" stroke-width="2.5"/>
          <ellipse cx="60" cy="60" rx="46" ry="18" fill="none" stroke="rgba(243,212,110,.4)" stroke-width="1"/>
          <ellipse cx="60" cy="60" rx="18" ry="46" fill="none" stroke="rgba(243,212,110,.4)" stroke-width="1"/>
          <path d="M32,68 C18,52 38,32 60,56 C82,80 102,60 88,44 C74,28 54,50 60,62 C66,74 46,84 32,68 Z" fill="none" stroke="url(#gInf)" stroke-width="6" stroke-linecap="round"/>
          <circle cx="38" cy="44" r="5" fill="#38bdf8" stroke="#fef08a" stroke-width="1.2"/>
          <path d="M84,38 C80,26 92,22 92,34 C96,24 106,30 98,40 Z" fill="#f472b6" stroke="#fef08a" stroke-width="1"/>
        </svg>
      </div>
      <div style="text-align:center">
        <h1>UBUK.NET</h1>
        <div class="sub">LATIF CONNECT FRAMEWORK</div>
      </div>
    </div>
