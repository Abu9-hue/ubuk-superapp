<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LATIF CONNECT — Super-App Souveraine (UBUK.NET)</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0A0D12">
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --bg-dark: #0A0D12;
            --header-bg: #11161F;
            --card-bg: #151C28;
            --bubble-out: #005C4B;
            --bubble-in: #1E2634;
            --cyan: #00E5FF;
            --gold: #F5B800;
            --green: #10B981;
            --text-main: #F1F5F9;
            --text-muted: #94A3B8;
            --border: #242E40;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--header-bg);
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .app-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-logo {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, var(--cyan), #0284C7);
            color: #000;
            font-weight: bold;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Georgia', serif;
        }

        .app-title h1 {
            font-size: 1.02rem;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .app-title span {
            font-size: 0.7rem;
            color: var(--green);
            font-family: 'Courier New', monospace;
            display: block;
        }

        .wallet-pill {
            background: #1B2432;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: bold;
            white-space: nowrap;
        }

        .main-viewport {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 75px;
        }

        .tab-view {
            display: none;
            height: 100%;
            flex-direction: column;
        }

        .tab-view.active { display: flex; }

        .bot-shortcuts {
            display: flex;
            gap: 8px;
            padding: 10px 12px;
            background: #0E131B;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
        }

        .bot-chip {
            background: var(--card-bg);
            border: 1px solid var(--cyan);
            color: var(--cyan);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.78rem;
            white-space: nowrap;
            cursor: pointer;
        }

        .chat-messages {
            flex: 1;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
        }

        .msg {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.88rem;
            line-height: 1.4;
        }

        .msg.in {
            background-color: var(--bubble-in);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .msg.out {
            background-color: var(--bubble-out);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .msg-sender {
            font-size: 0.72rem;
            font-weight: bold;
            color: var(--gold);
            margin-bottom: 3px;
            display: block;
        }

        .msg-time {
            font-size: 0.65rem;
            color: rgba(255,255,255,0.6);
            text-align: right;
            margin-top: 4px;
            display: block;
        }

        .chat-input-bar {
            display: flex;
            gap: 8px;
            padding: 10px 12px;
            background: var(--header-bg);
            border-top: 1px solid var(--border);
        }

        .chat-input-bar input {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            outline: none;
        }

        .btn-send {
            background: var(--cyan);
            color: #000;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }

        .section-pad {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
        }

        .card h3 {
            color: var(--gold);
            font-size: 0.96rem;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .kpi-box {
            background: #0E131B;
            padding: 12px;
            border-radius: 6px;
            border-left: 3px solid var(--cyan);
        }

        .kpi-box small {
            color: var(--text-muted);
            font-size: 0.72rem;
            display: block;
        }

        .kpi-box strong {
            font-size: 1.1rem;
            color: var(--text-main);
        }

        input.field, select.field {
            width: 100%;
            background: #0E131B;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 11px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.86rem;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-cyan { background: var(--cyan); color: #000; }
        .btn-gold { background: var(--gold); color: #000; }
        .btn-green { background: var(--green); color: #000; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        th, td {
            padding: 8px 6px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th { color: var(--text-muted); font-size: 0.75rem; }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .service-tile {
            background: #0E131B;
            border: 1px solid var(--border);
            padding: 14px 10px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .service-tile:hover { border-color: var(--gold); }
        .service-tile strong { display: block; color: var(--text-main); margin-top: 6px; font-size: 0.88rem; }
        .service-tile span { font-size: 0.72rem; color: var(--text-muted); }

        .split-bar {
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            display: flex;
            margin: 10px 0;
            background: #0E131B;
        }

        .nisab-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.68rem;
            font-family: 'Courier New', monospace;
            background: rgba(16, 185, 129, 0.15);
            color: var(--green);
            border: 1px solid var(--green);
            white-space: nowrap;
        }

        #multimodal-display {
            display: none;
            margin-top: 12px;
            padding: 12px;
            background: #0A0D12;
            border: 1px dashed var(--cyan);
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            line-height: 1.5;
        }

        nav.bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 64px;
            background-color: var(--header-bg);
            border-top: 1px solid var(--border);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            z-index: 20;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.72rem;
            gap: 4px;
            cursor: pointer;
            border: none;
            background: none;
        }

        .nav-item.active {
            color: var(--cyan);
            font-weight: bold;
        }
