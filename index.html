<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>UBUK.NET — Latif Connect Framework</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100vw;overflow-x:hidden}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background-color:#050c18;background-image:radial-gradient(circle at 50% 50%,rgba(243,212,110,.09) 2px,transparent 3px,transparent 14px,rgba(30,64,175,.18) 15px,transparent 17px,transparent 28px,rgba(212,175,55,.12) 29px,transparent 31px,transparent 42px,rgba(37,99,235,.15) 43px,transparent 45px),repeating-conic-gradient(from 0deg at 50% 50%,rgba(212,175,55,.07) 0deg 15deg,rgba(12,34,68,.22) 15deg 30deg);background-size:96px 96px,96px 96px;color:#f8fafc;min-height:100vh;padding-bottom:28px}
.wrap{width:100%;max-width:760px;margin:0 auto;padding:8px 8px 20px}
.top-head{text-align:center;margin-bottom:9px}
.head-bar{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:5px}
.head-logo{flex-shrink:0}
.top-head h1{color:#f3d46e;font-size:clamp(1.7rem,5vw,2.25rem);letter-spacing:3px;font-weight:900;line-height:1;text-shadow:0 0 20px rgba(243,212,110,.55)}
.top-head .sub{color:#d4af37;font-size:.66rem;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;margin-top:3px}
.manifesto{width:100%;margin:0 auto;background:rgba(5,13,24,.88);border:1px solid rgba(212,175,55,.5);border-radius:10px;padding:7px 9px;font-size:.63rem;line-height:1.38;color:#f3d46e;text-align:justify;text-align-last:center}
.manifesto .mission{display:block;margin-top:3px;color:#fef08a;font-weight:700;font-size:.61rem}
.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px;width:100%}
.kpi-box{background:rgba(5,13,24,.88);border:1px solid rgba(212,175,55,.42);border-radius:10px;padding:6px;min-width:0}
.kpi-head{display:flex;justify-content:space-between;font-size:.54rem;font-weight:800;color:#e2e8f0;margin-bottom:4px;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:2px;gap:2px}
.kpi-head span{color:#10b981;white-space:nowrap}
.bars{display:flex;align-items:flex-end;gap:3px;height:28px;margin-bottom:4px}
.bars i{flex:1;background:linear-gradient(180deg,#f3d46e,#b45309);border-radius:2px 2px 0 0;display:block}
.hbars{display:grid;gap:2px;margin-bottom:4px}
.hbar{display:flex;align-items:center;gap:4px;font-size:.51rem;color:#94a3b8}
.hbar div{flex:1;height:4px;background:#1e293b;border-radius:4px;overflow:hidden}
.hbar span{display:block;height:100%;background:linear-gradient(90deg,#10b981,#f3d46e)}
.kpi-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;text-align:center}
.kpi-nums b{display:block;color:#fff;font-size:.66rem}
.kpi-nums small{color:#94a3b8;font-size:.46rem}
.top-cta{display:flex;justify-content:center;margin-bottom:16px}
.btn-app-gold{background:linear-gradient(135deg,#fef08a 0%,#d4af37 50%,#b45309 100%);color:#050b12;text-decoration:none;font-weight:900;font-size:.74rem;padding:8px 18px;border-radius:999px;border:1px solid #fef08a;box-shadow:0 0 18px rgba(212,175,55,.5);display:inline-flex;align-items:center;justify-content:center;gap:5px;letter-spacing:.3px}
.arena{position:relative;width:100%;margin:0 auto 9px;display:grid;grid-template-columns:minmax(94px,112px) 1fr minmax(94px,112px);grid-template-rows:auto auto;gap:20px 4px;align-items:center;justify-items:center}
@media(min-width:640px){.arena{grid-template-columns:150px 1fr 150px;gap:28px 14px}}
.benef-slot{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:100%;min-width:0}
.pill-top{position:absolute;top:-16px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.3);color:#f8fafc;font-size:.49rem;font-weight:800;letter-spacing:.7px;padding:1px 7px;border-radius:999px;white-space:nowrap}
.card-p{width:100%;min-height:124px;background:rgba(8,16,28,.94);border:1.5px solid #d4af37;border-radius:10px;overflow:hidden;position:relative;box-shadow:0 5px 14px rgba(0,0,0,.65)}
.num-badge{position:absolute;top:3px;right:3px;background:rgba(5,11,18,.9);color:#f3d46e;font-weight:900;font-size:.52rem;padding:1px 4px;border-radius:4px;border:1px solid #d4af37;z-index:3}
.num-wm{position:absolute;top:11px;left:4px;font-size:1.25rem;font-weight:900;color:rgba(243,212,110,.16);pointer-events:none;z-index:1}
.avatar-box{height:60px;background:radial-gradient(circle at 50% 40%,#1e3a5f,#071019);display:flex;align-items:center;justify-content:center;font-size:1.85rem;position:relative;z-index:2}
@media(min-width:640px){.avatar-box{height:102px;font-size:2.6rem}}
.p-info{padding:4px 5px;background:#060e17;border-top:1px solid rgba(212,175,55,.32);text-align:left}
.p-info strong{display:block;color:#fff;font-size:.58rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-info span{color:#cbd5e1;font-size:.49rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.globe-wrap{grid-column:2;grid-row:1/3;position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-width:0}
#globeCanvas{width:120px;height:120px;border-radius:50%;border:2px solid var(--glow,#ef4444);box-shadow:0 0 30px var(--glow,#ef4444);transition:box-shadow .6s ease,border-color .6s ease}
@media(min-width:640px){#globeCanvas{width:224px;height:224px}}
.orbit-news{margin-top:-11px;background:rgba(5,11,18,.96);border:1.5px solid var(--glow,#ef4444);color:#fff;padding:3px 6px;border-radius:999px;font-size:.49rem;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.7);text-align:center;max-width:130px;transition:border-color .6s ease}
@media(min-width:640px){.orbit-news{font-size:.72rem;max-width:320px;padding:5px 14px}}
.rainbow-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;width:100%;max-width:340px;margin:7px auto 0}
.r-btn{background:rgba(5,13,24,.94);border:1px solid var(--bc,#d4af37);border-radius:9px;padding:6px 6px;font-size:.54rem;font-weight:800;color:#f8fafc;cursor:pointer;text-transform:uppercase;letter-spacing:.2px;box-shadow:0 3px 9px rgba(0,0,0,.55);display:flex;align-items:center;gap:5px;text-align:left;line-height:1.15}
.r-btn i{width:8px;height:8px;border-radius:50%;background:var(--bc);box-shadow:0 0 8px var(--bc);flex-shrink:0}
footer{width:100%;max-width:350px;margin:7px auto 0;padding:2px;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;text-align:justify;text-align-last:center;font-size:.41rem;color:rgba(243,212,110,.28);letter-spacing:.1px;line-height:1.45;pointer-events:none;user-select:none}
.page-modal{display:none;position:fixed;inset:0;background:#050b12;z-index:999;overflow-y:auto;padding:18px}
.page-modal.open{display:block}
.modal-inner{max-width:960px;margin:0 auto;background:#0b1726;border:1px solid #d4af37;border-radius:16px;padding:20px}
.modal-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(212,175,55,.3);padding-bottom:12px;margin-bottom:16px}
.btn-retour{background:#10b981;color:#fff;border:none;padding:9px 16px;border-radius:10px;font-weight:800;cursor:pointer}
</style>
</head>
