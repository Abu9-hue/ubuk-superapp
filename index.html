<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>UBUK.NET — Latif Connect Framework</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background-color:#040911;background-image:radial-gradient(circle at 50% 44%,rgba(212,175,55,.18),transparent 56%),repeating-conic-gradient(from 0deg at 50% 46%,rgba(212,175,55,.09) 0deg 15deg,rgba(12,52,84,.22) 15deg 30deg),repeating-radial-gradient(circle at 50% 46%,transparent 0,transparent 24px,rgba(212,175,55,.11) 25px,rgba(10,42,68,.2) 27px);color:#f8fafc;min-height:100vh;overflow-x:hidden}
.wrap{max-width:1180px;margin:0 auto;padding:12px 10px 22px}
.top-head{text-align:center;margin-bottom:12px}
.top-head h1{color:#f3d46e;font-size:clamp(1.6rem,3.6vw,2.3rem);letter-spacing:4px;font-weight:900;text-shadow:0 0 24px rgba(243,212,110,.4)}
.top-head .sub{color:#d4af37;font-size:.64rem;letter-spacing:1.6px;text-transform:uppercase;margin-bottom:8px}
.manifesto{max-width:780px;margin:0 auto;background:rgba(7,15,26,.92);border:1px solid rgba(212,175,55,.45);border-radius:12px;padding:9px 12px;font-size:.67rem;line-height:1.48;color:#f3d46e;box-shadow:0 6px 20px rgba(0,0,0,.55)}
.manifesto strong{color:#fef08a}
.manifesto .mission{display:block;margin-top:4px;color:#d4af37;font-weight:600;font-size:.65rem}
.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi-box{background:rgba(7,15,26,.92);border:1px solid rgba(212,175,55,.38);border-radius:12px;padding:10px}
.kpi-head{display:flex;justify-content:space-between;font-size:.64rem;font-weight:800;color:#e2e8f0;margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:4px;gap:4px}
.kpi-head span{color:#10b981;white-space:nowrap}
.bars{display:flex;align-items:flex-end;gap:3px;height:38px;margin-bottom:6px}
.bars i{flex:1;background:linear-gradient(180deg,#f3d46e,#b45309);border-radius:2px 2px 0 0;display:block}
.hbars{display:grid;gap:4px;margin-bottom:6px}
.hbar{display:flex;align-items:center;gap:4px;font-size:.58rem;color:#94a3b8}
.hbar div{flex:1;height:5px;background:#1e293b;border-radius:4px;overflow:hidden}
.hbar span{display:block;height:100%;background:linear-gradient(90deg,#10b981,#f3d46e)}
.kpi-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;text-align:center}
.kpi-nums b{display:block;color:#fff;font-size:.74rem}
.kpi-nums small{color:#94a3b8;font-size:.54rem}
.top-cta{display:flex;justify-content:center;margin-bottom:24px}
.btn-app-gold{background:linear-gradient(135deg,#fef08a 0%,#d4af37 50%,#b45309 100%);color:#050b12;text-decoration:none;font-weight:900;font-size:.76rem;padding:10px 20px;border-radius:999px;border:1px solid #fef08a;box-shadow:0 0 26px rgba(212,175,55,.55);display:inline-flex;align-items:center;justify-content:center;gap:7px;letter-spacing:.5px}
.arena{position:relative;width:100%;max-width:700px;margin:0 auto 16px;padding:6px 4px;display:grid;grid-template-columns:96px 1fr 96px;grid-template-rows:auto auto;gap:28px 8px;align-items:center;justify-items:center}
@media(min-width:768px){.arena{grid-template-columns:138px 1fr 138px;gap:32px 18px}}
.benef-slot{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:100%}
.pill-top{position:absolute;top:-20px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.1);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.26);color:#f8fafc;font-size:.55rem;font-weight:800;letter-spacing:.9px;padding:2px 9px;border-radius:999px;white-space:nowrap}
.card-p{width:100%;background:rgba(8,16,28,.96);border:1.5px solid #d4af37;border-radius:11px;overflow:hidden;position:relative;box-shadow:0 8px 20px rgba(0,0,0,.6)}
.num-badge{position:absolute;top:5px;right:6px;background:rgba(5,11,18,.9);color:#f3d46e;font-weight:900;font-size:.6rem;padding:1px 5px;border-radius:5px;border:1px solid #d4af37;z-index:3}
.num-wm{position:absolute;top:14px;left:6px;font-size:1.45rem;font-weight:900;color:rgba(243,212,110,.18);pointer-events:none;z-index:1}
.avatar-box{height:70px;background:radial-gradient(circle at 50% 40%,#1e3a5f,#071019);display:flex;align-items:center;justify-content:center;font-size:1.95rem;position:relative;z-index:2}
@media(min-width:768px){.avatar-box{height:105px;font-size:2.6rem}}
.p-info{padding:5px 6px;background:#060e17;border-top:1px solid rgba(212,175,55,.3);text-align:left}
.p-info strong{display:block;color:#fff;font-size:.65rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-info span{color:#cbd5e1;font-size:.56rem;display:block}
.globe-wrap{grid-column:2;grid-row:1/3;position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}
#globeCanvas{width:154px;height:154px;border-radius:50%;border:2px solid #dc2626;box-shadow:0 0 42px var(--glow,#ef4444);transition:box-shadow .6s ease}
@media(min-width:768px){#globeCanvas{width:236px;height:236px}}
.orbit-news{margin-top:-14px;background:rgba(5,11,18,.96);border:2px solid var(--glow,#ef4444);color:#fff;padding:4px 9px;border-radius:999px;font-size:.56rem;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.65);text-align:center;max-width:172px;transition:border-color .6s ease}
@media(min-width:768px){.orbit-news{font-size:.74rem;max-width:340px;padding:6px 14px}}
.rainbow-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;width:100%;max-width:310px;margin:10px auto 0}
.r-btn{background:rgba(7,15,26,.94);border:1px solid var(--bc,#d4af37);border-radius:8px;padding:7px 6px;font-size:.55rem;font-weight:800;color:#f8fafc;cursor:pointer;text-transform:uppercase;letter-spacing:.2px;box-shadow:0 3px 10px rgba(0,0,0,.5);display:flex;align-items:center;gap:5px;text-align:left;line-height:1.15}
.r-btn i{width:8px;height:8px;border-radius:50%;background:var(--bc);box-shadow:0 0 8px var(--bc);flex-shrink:0}
footer{width:100%;max-width:310px;margin:12px auto 0;padding:4px 2px;font-family:'Georgia','Times New Roman',serif;font-style:italic;text-align:justify;text-align-last:center;font-size:.5rem;color:rgba(243,212,110,.52);letter-spacing:.2px;line-height:1.45;pointer-events:none;user-select:none}
.page-modal{display:none;position:fixed;inset:0;background:#050b12;z-index:999;overflow-y:auto;padding:18px}
.page-modal.open{display:block}
.modal-inner{max-width:960px;margin:0 auto;background:#0b1726;border:1px solid #d4af37;border-radius:16px;padding:20px}
.modal-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(212,175,55,.3);padding-bottom:12px;margin-bottom:16px}
.btn-retour{background:#10b981;color:#fff;border:none;padding:9px 16px;border-radius:10px;font-weight:800;cursor:pointer}
</style>
</head>
